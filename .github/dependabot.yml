version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    # Grouped so a quiet week is one PR, not fifteen — each PR still burns CI
    # minutes on the free plan.
    open-pull-requests-limit: 5
    # Let routine releases settle. GitHub does not apply cooldown to security fixes.
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # Types must describe the runtime we deploy on (.nvmrc). Bump this major
      # by hand, together with .nvmrc and the CI node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @convex-dev/better-auth 0.12 supports better-auth <1.7 only. Move both
      # together by hand, then `pnpm auth:schema` (docs/architecture/auth.md).
      - dependency-name: "better-auth"
        versions: [">=1.7.0"]
    groups:
      # Security updates have a separate queue and must not wait for routine batches.
      security-production:
        applies-to: security-updates
        dependency-type: production
        patterns: ["*"]
      security-development:
        applies-to: security-updates
        dependency-type: development
        patterns: ["*"]
      # Expo SDK upgrades need `expo install --check` and device verification.
      # Keep routine native packages together; major upgrades remain individual PRs.
      expo:
        patterns: ["expo", "expo-*", "react-native", "react-native-*"]
        update-types: ["minor", "patch"]
      convex-auth:
        patterns: ["convex", "convex-test", "@convex-dev/*", "better-auth"]
        update-types: ["minor", "patch"]
      react:
        update-types: ["minor", "patch"]
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        update-types: ["minor", "patch"]
        patterns: ["next", "eslint-config-next", "@next/*"]
      testing:
        update-types: ["minor", "patch"]
        patterns:
          [
            "vitest",
            "@vitest/*",
            "vite",
            "@vitejs/*",
            "@testing-library/*",
            "@playwright/test",
          ]
      linting:
        update-types: ["minor", "patch"]
        patterns:
          [
            "eslint*",
            "typescript-eslint",
            "prettier*",
            "@commitlint/*",
            "husky",
            "lint-staged",
          ]
      tailwind:
        patterns:
          ["tailwindcss", "@tailwindcss/*", "tailwind-merge", "tw-animate-css"]
        update-types: ["minor", "patch"]
      # Catch-all goes last: Dependabot uses the first matching group.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(ci)"
